apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deployment
  labels:
    app: node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      containers:
      - name: node
        image: ghcr.io/abhishek-chauhan-dev/node-app:757afc0e1f7576b083cf1dec05d5648996001155
        ports:
        - containerPort: 8080
      imagePullSecrets:
        - name: ghcr-secret
        
